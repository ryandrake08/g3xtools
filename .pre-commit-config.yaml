repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff-format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy
        entry: mypy --ignore-missing-imports --scripts-are-modules
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: pyright
        name: pyright
        entry: pyright
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: vermin
        name: Check minimum Python version
        entry: vermin --target=3.9- --violations
        language: system
        types: [python]
        require_serial: true
